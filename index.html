<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AIRA Assistant</title>

  ./styles.css
</head>

<body>
  <div class="container">

    <div class="avatar-section">
      ./AIRABOT.png

      <h1>AIRA</h1>
      <p>Arrow Intelligent Resource Assistant</p>
    </div>

    <div class="chat-section">
      <div id="messages" class="messages">
        <p class="aira-message">
          <strong>AIRA:</strong> Hola, soy AIRA. ¿En qué puedo ayudarte?
        </p>
      </div>

      <div class="input-area">
        <input
          id="userInput"
          type="text"
          placeholder="Pregunta algo..."
        />

        <button onclick="sendMessage()">Enviar</button>
      </div>
    </div>

  </div>

  ./app.jsscript>
</body>
</html>
